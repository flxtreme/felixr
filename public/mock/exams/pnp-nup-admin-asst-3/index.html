<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PNP NUP Admin Asst I Mock Exam – Set 3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5fa;--card:#fff;--tx:#14213d;--mu:#5c6784;--pr:#1d4ed8;--bd:#d6dcec;--ok:#16a34a;--no:#dc2626;--okb:#dcfce7;--nob:#fee2e2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--tx:#e8ecf7;--mu:#9aa6c4;--pr:#6b8cff;--bd:#2b3858;--okb:#12391f;--nob:#432026}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--tx:#e8ecf7;--mu:#9aa6c4;--pr:#6b8cff;--bd:#2b3858;--okb:#12391f;--nob:#432026}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mu{color:var(--mu);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--pr);transition:width .3s}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-bottom:14px}
.nav button{padding:7px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font-size:.85rem}
.nav .ans{background:var(--pr);color:#fff;border-color:var(--pr)}
.nav .cur{outline:3px solid var(--tx);outline-offset:1px}
.nav .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.nav .no{background:var(--no);color:#fff;border-color:var(--no)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;min-height:320px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.tag{font-size:.75rem;color:var(--pr);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.q{font-size:1.2rem;font-weight:600;margin:6px 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border:2px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;cursor:pointer;font-size:1rem;font-family:inherit}
.opt:hover{border-color:var(--pr)}
.opt b{min-width:20px}
.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.opt:disabled{cursor:default}
.ctl{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:1rem;font-family:inherit}
.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn.s{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center}
.score{font-size:3.2rem;font-weight:800;margin:6px 0}
.pass{color:var(--ok)}.fail{color:var(--no)}
.stats{display:flex;justify-content:center;gap:22px;margin:10px 0 18px;flex-wrap:wrap}
.stats div{background:var(--bg);border-radius:10px;padding:10px 18px}
.stats b{display:block;font-size:1.4rem}
.warn{color:var(--no);font-weight:600;margin:8px 0 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>PNP NUP Admin Asst I – Mock Exam – Set 3</h1><span class="mu" id="prog"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="nav" id="nav"></div>
  <div class="card" id="card"></div>
  <div class="ctl" id="ctl">
    <button class="btn" id="prev">← Previous</button>
    <button class="btn p" id="next">Next →</button>
    <button class="btn s hide" id="sub">Submit</button>
  </div>
</div>
<script>
const D=[
["RA 6975 merged the Philippine Constabulary with the:","Integrated National Police","Bureau of Customs","NBI","Coast Guard"],
["Which law is the PNP Reform and Reorganization Act?","RA 8551","RA 6713","RA 11032","RA 10173"],
["RA 8551 institutionalized which sensitivity in the PNP?","Gender sensitivity","Age sensitivity","Cultural quota only","Religious quota"],
["The BJMP was created by:","RA 6975","RA 9708","RA 6713","RA 10173"],
["The Chief, PNP ranks as the:","Highest ranking uniformed officer","Chairman of NAPOLCOM","President's deputy","DILG Undersecretary"],
["TDCA stands for:","Deputy Chief for Administration","Director of Central Archives","Technical Data Control Assistant","Deputy Chief for Arms"],
["Who chairs NAPOLCOM?","DILG Secretary","Chief, PNP","Ombudsman","Chief Justice"],
["The Internal Affairs Service investigates:","Police misconduct","Civilian complaints against barangays","Tax evasion","Traffic violations"],
["DICTM manages:","Database management and cybersecurity","Crime investigation","Police promotions","Firearms licensing"],
["The Crime Registrar's work centers on the:","Police blotter and crime databases","Patrol deployment","Court sentencing","Jail management"],
["Before CIRAS, the system was called:","e-Blotter","e-Rogue","NCIS","e-Subpoena"],
["Encoding of incidents in CIRAS is required within:","24 hours of reporting","1 week","1 month","End of year"],
["The NCIS links:","Law enforcement institutions nationwide","Only barangays","Only courts","Only schools"],
["How many index (focus) crimes are tracked by the PNP?","8","6","9","15"],
["Rape is classified as a(n):","Index crime","Non-index crime","Ordinance violation","Civil case"],
["Robbery and theft are both:","Index crimes","Non-index crimes","Special law violations","Ordinance violations"],
["Carnapping covers motor vehicles and:","Motorcycles","Bicycles","Boats","Aircraft"],
["Illegal gambling is a:","Non-index crime","Focus crime","Index crime","Civil offense"],
["Illegal logging is a:","Non-index crime","Index crime","Focus crime","Felony against persons only"],
["Crime Volume includes:","Both index and non-index crimes","Only index crimes","Only solved cases","Only drug cases"],
["CSE is computed as:","Solved cases ÷ crime volume × 100","Cleared cases ÷ solved × 100","Crime volume ÷ population","Index ÷ non-index"],
["A cleared case means:","Offender identified and charged but none arrested","All suspects jailed","The victim withdrew","No offender identified"],
["If 25 of 50 crimes are cleared, CCE is:","50%","25%","75%","5%"],
["If 30 of 150 crimes are solved, CSE is:","20%","30%","15%","50%"],
["Which is an input device?","Barcode reader","Plotter","Speaker","Monitor"],
["Which is an output device?","Plotter","Biometric scanner","Keyboard","Webcam"],
["Which is a storage device?","Solid State Drive","Printer","Mouse","Monitor"],
["The motherboard is part of the:","System unit","Output devices","Cloud storage","Network"],
["RAM is described as:","Volatile memory","Permanent storage","Input device","Non-volatile memory"],
["Excel's =COUNT() counts:","Cells containing numbers","Non-empty cells of any type","Text only","Blank cells"],
["Excel's =VLOOKUP() requires a:","Lookup value, table array and column index number","Printer","Macro only","Hyperlink"],
["Pivot Tables help produce:","Monthly crime summaries","Spelling corrections","Slideshows","Email replies"],
["In MS Word, headers and footers are examples of:","Formatting","Formulas","Macros","Charts"],
["Shortcut for Save:","Ctrl + S","Ctrl + P","Ctrl + F","Ctrl + X"],
["Shortcut for Cut:","Ctrl + X","Ctrl + C","Ctrl + Z","Ctrl + V"],
["Shortcut for Redo:","Ctrl + Y","Ctrl + Z","Ctrl + P","Alt + Tab"],
["Shortcut for Print:","Ctrl + P","Ctrl + S","Ctrl + F","Ctrl + Y"],
["The Data Privacy Act year is:","2012","1990","1998","2016"],
["A Personal Information Controller is responsible for:","Protecting personal data under its control","Selling records","Deleting all blotters","Hosting social media"],
["When leaving your workstation you should:","Lock the screen","Leave logged in","Share the password","Turn off the monitor only"],
["Which pillar handles rehabilitation and incarceration?","Corrections","Prosecution","Law Enforcement","Courts"],
["Preliminary investigation is conducted by the:","Prosecution","Courts","Corrections","Community"],
["Barangay Lupon Tagapamayapa handles:","Local dispute resolution","Sentencing","Arrests","Jail operations"],
["The Court of Appeals belongs to the ____ pillar.","Courts","Prosecution","Corrections","Community"],
["'Professionalism' under RA 6713 means performing duties with:","Excellence, intelligence and skill","Speed only","Loyalty to superiors only","Minimal effort"],
["'Responsiveness to the public' means:","Prompt, courteous and adequate service","Serving friends first","Service only on request by seniors","Delayed service"],
["The Zero-Contact Policy under RA 11032 limits contact to:","Necessary application processing","Social gatherings","Private meetings","Gift giving"],
["Numeric filing organizes records by:","Assigned sequence numbers","Surnames","Dates","Topics"],
["Police memos should be:","Concise and factual","Long and emotional","Informal","Opinionated"],
["Percentage formula:","(Part ÷ Whole) × 100","(Whole ÷ Part) × 100","Part + Whole","Part − Whole"]
];
const PASS=80,KEY="pnp_nup_exam_set3";
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({ord:sh(D.map((_,i)=>i)).map(i=>({i,o:sh([0,1,2,3])})),A:Array(D.length).fill(null),cur:0,done:false});
let Q,A,cur,done,S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.ord||S.ord.length!==D.length||!S.A||S.A.length!==D.length)S=fresh();
function build(){Q=S.ord.map(x=>({q:D[x.i][0],o:x.o.map(k=>({t:D[x.i][k+1],c:k===0}))}))}
function save(){S.A=A;S.cur=cur;S.done=done;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function init(){build();A=S.A;cur=Math.min(S.cur||0,Q.length-1);done=!!S.done;$("ctl").classList.remove("hide");if(done)result();else render()}
function retake(){S=fresh();A=S.A;cur=0;done=false;save();init();window.scrollTo(0,0)}
const $=id=>document.getElementById(id),L="ABCD";
function nav(){$("nav").innerHTML=Q.map((q,i)=>{let c=i===cur?"cur ":"";if(done)c+=A[i]!==null&&q.o[A[i]].c?"ok":"no";else if(A[i]!==null)c+="ans";return`<button class="${c}" onclick="go(${i})">${i+1}</button>`}).join("")}
function render(){
  const q=Q[cur],n=A.filter(a=>a!==null).length;
  $("prog").textContent=`Question ${cur+1} of ${Q.length} · Answered ${n}`;
  $("fill").style.width=(n/Q.length*100)+"%";
  let h=`<div class="tag">Question ${cur+1}</div><div class="q">${q.q}</div>`;
  q.o.forEach((o,i)=>{let c="opt";if(done)c+=o.c?" ok":A[cur]===i?" no":"";else if(A[cur]===i)c+=" sel";
    h+=`<button class="${c}" ${done?"disabled":""} onclick="pick(${i})"><b>${L[i]}.</b><span>${o.t}</span></button>`});
  if(done&&A[cur]===null)h+=`<p class="mu">Not answered.</p>`;
  h+=`<p class="warn hide" id="warn">⚠ Please choose an answer first.</p>`;
  $("card").innerHTML=h;
  $("prev").disabled=cur===0;
  $("next").disabled=cur===Q.length-1;
  $("sub").classList.toggle("hide",done||cur!==Q.length-1);
  nav();
}
function pick(i){if(done)return;A[cur]=i;save();render()}
function go(i){cur=i;save();render()}
$("prev").onclick=()=>go(cur-1);
function nextQ(){if(!done&&A[cur]===null){const w=$("warn");if(w)w.classList.remove("hide");return}if(cur<Q.length-1)go(cur+1)}
$("next").onclick=nextQ;
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||$("ctl").classList.contains("hide"))return;
  if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();nextQ()}
  else if(e.key==="ArrowLeft"){e.preventDefault();if(cur>0)go(cur-1)}
  else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&!done){e.preventDefault();const n=Q[cur].o.length,d=e.key==="ArrowDown"?1:-1;pick(A[cur]===null?(d>0?0:n-1):(A[cur]+d+n)%n)}});
$("sub").onclick=()=>{
  const un0=A.filter(a=>a===null).length;
  if(un0&&!confirm(`${un0} question(s) unanswered. Submit anyway?`))return;
  done=true;save();result();
};
function result(){
  const un=A.filter(a=>a===null).length;
  const s=Q.filter((q,i)=>A[i]!==null&&q.o[A[i]].c).length,p=Math.round(s/Q.length*1000)/10,ok=p>=PASS;
  $("ctl").classList.add("hide");
  $("card").innerHTML=`<div class="res"><div class="tag">Exam Result</div><div class="score ${ok?"pass":"fail"}">${s} / ${Q.length}</div>
  <h2 class="${ok?"pass":"fail"}">${p}% — ${ok?"PASSED":"FAILED"}</h2><p class="mu">Passing score: ${PASS}%</p>
  <div class="stats"><div><b>${s}</b>Correct</div><div><b>${Q.length-s-un}</b>Wrong</div><div><b>${un}</b>Unanswered</div></div>
  <button class="btn" onclick="review()">Review Answers</button> <button class="btn p" onclick="retake()">Retake Exam</button></div>`;
  $("fill").style.width="100%";nav();window.scrollTo(0,0);
}
function review(){$("ctl").classList.remove("hide");$("sub").classList.add("hide");$("next").classList.remove("hide");$("prev").classList.remove("hide");cur=0;render()}
init();
</script>
</body>
</html>
